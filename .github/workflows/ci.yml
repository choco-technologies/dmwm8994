name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmwm8994
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmwm8994.dmf
          test -f build/dmf/dmwm8994_version.txt
          test -f build/dmf/test_dmwm8994.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install dmdevfs -y
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmwm8994-local.dmd -y
          dmod_loader build/dmf/test_dmwm8994.dmf --args /dev/wm8994 tests/fixtures/valid tests/fixtures/invalid
