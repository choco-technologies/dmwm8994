; STM32F746G-DISCO: WM8994 uses I2C3 (PH7/PH8, 7-bit address 0x1A) and
; SAI2 A/B (PI4..PI7, PG10). Wiring: ST STM32746G Discovery audio BSP.
; This file owns both controllers. Do not also load touch.ini or i2c3.ini,
; which would configure I2C3 again, or dmsai's sai2.ini.

[wm8994_i2c_scl]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PH7
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[wm8994_i2c_sda]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PH8
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[wm8994_i2c]
driver_name=dmi2c
driver_order=11
friends_group=wm8994
friend_role=i2c_bus
instance=3
role=master
address=26
baudrate=100000
timeout_ms=100

[wm8994_sai_mclk]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PI4
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_sck]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PI5
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_tx]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PI6
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_fs]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PI7
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_rx]
driver_name=dmgpio
driver_order=10
friends_group=wm8994
pin=PG10
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai]
driver_name=dmsai
driver_order=11
friends_group=wm8994
friend_role=audio_stream
instance=1
clock_role=master
framing=tdm
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=16
slot_count=4
frame_bits=64
; Slots 0/2 carry headphone playback; slots 1/3 carry DMIC2 capture.
active_slots=15
transmit=on
receive=on

[wm8994]
driver_name=dmwm8994
driver_order=12
friends_group=wm8994
; ST's stm32746g_discovery.h defines AUDIO_I2C_ADDRESS as 0x34, the
; HAL-style address with its R/W bit position. dmi2c expects a 7-bit
; address, so the value here is 0x34 >> 1 = 0x1A = 26.
; https://github.com/STMicroelectronics/32f746gdiscovery-bsp/blob/main/stm32746g_discovery.h
address=26
input=dmic2
