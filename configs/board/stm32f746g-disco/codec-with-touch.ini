; STM32F746G-DISCO: WM8994 codec next to the touch panel. I2C3 (PH7/PH8) is
; shared: the codec uses the bus node that dmft5336's touch.ini creates
; (/dev/dmi2cx/touch_i2c, friend_role=i2c_bus) at its own 7-bit address 0x1A,
; so this file has neither the I2C3 pins nor a bus section. dmi2c lets any
; number of clients use a bus node; transfers are serialized.
;
; Load it together with touch.ini - the codec finds its bus there - and not
; with codec.ini or i2c3.ini, which would configure I2C3 a second time. For
; audio without the touch panel use codec.ini instead.
;
; Everything here joins friends_group=lcd, the group of touch.ini and of
; dmlcdtft's lcd.ini, because a node is in one group and the codec has to find
; the bus in its own. Every driver picks its friends by friend_role, so the
; display, the panel and the audio nodes do not disturb each other (dmview
; opens each friend of its display to look for an input; the codec and the SAI
; just answer "not an input").
;
; SAI2 A/B (PI4..PI7, PG10): ST STM32746G Discovery audio BSP wiring.

[wm8994_sai_mclk]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PI4
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_sck]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PI5
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_tx]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PI6
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_fs]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PI7
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai_rx]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PG10
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=none

[wm8994_sai]
driver_name=dmsai
driver_order=11
friends_group=lcd
friend_role=audio_stream
instance=1
clock_role=master
framing=tdm
pcm_format=s16_le
sample_rate_hz=48000
tolerance_ppm=500
slot_bits=16
slot_count=4
frame_bits=64
; Slots 0/2 carry headphone playback; slots 1/3 carry DMIC2 capture.
active_slots=15
transmit=on
receive=on

[wm8994]
driver_name=dmwm8994
driver_order=12
friends_group=lcd
; ST's stm32746g_discovery.h defines AUDIO_I2C_ADDRESS as 0x34, the
; HAL-style address with its R/W bit position. dmi2c expects a 7-bit
; address, so the value here is 0x34 >> 1 = 0x1A = 26.
; https://github.com/STMicroelectronics/32f746gdiscovery-bsp/blob/main/stm32746g_discovery.h
address=26
input=dmic2
; The board has one speaker (JP3): both channels are mixed into it
speaker=mono
; The class D amplifier at full gain draws more than the board's 3.3 V gives -
; above ~80% the SD card drops out. Volume 100% is 80% of the speaker gain.
speaker_volume_max=80
